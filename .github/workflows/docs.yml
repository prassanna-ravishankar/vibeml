name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for git-based features

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'docs/requirements.txt'

      - name: Install dependencies
        run: |
          uv pip install --system -r docs/requirements.txt

      - name: Install package (for mkdocstrings)
        run: |
          uv pip install --system -e .

      - name: Build documentation
        run: |
          mkdocs build --strict --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: site/
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: docs
          path: site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'docs/requirements.txt'

      - name: Install dependencies
        run: |
          uv pip install --system -r docs/requirements.txt
          uv pip install --system -e .

      # site_url puts the docs under /vibeml, so pages link to /vibeml/...;
      # build into a matching layout so root-relative links resolve.
      - name: Build docs for link checking
        run: |
          mkdocs build -d _site/vibeml

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress
            --root-dir ${{ github.workspace }}/_site
            --exclude '^https://prassanna\.io/vibeml'
            --exclude '^https://console\.nebius\.com'
            '_site/**/*.html'
          fail: true
